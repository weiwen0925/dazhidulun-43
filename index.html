<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);

}
*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);

  font-size:17px;line-height:1.85;
  scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
img{-webkit-user-drag:none;pointer-events:none;}

/* Sidebar */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);writing-mode:horizontal-tb;text-orientation:mixed;
  text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}

.sb-nav{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;
  padding:8px 0;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 4px;text-decoration:none;color:var(--sbText);
  width:100%;transition:all .25s;border-radius:8px;}
.sb-item:hover{background:rgba(184,134,11,.12);}
.sb-circle{width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;
  color:var(--gold);transition:all .25s;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;
  letter-spacing:1.5px;color:var(--sbText);opacity:.85;}
.sb-item.active .sb-circle{background:var(--gold);color:#fff;
  box-shadow:0 0 14px rgba(184,134,11,.55);transform:scale(1.08);}
.sb-item.active .sb-label{color:var(--goldL);opacity:1;font-weight:600;}

#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:200;
  width:42px;height:42px;border-radius:50%;background:var(--sbBg);
  color:var(--gold);border:1px solid rgba(184,134,11,.5);
  font-size:18px;cursor:pointer;}

/* main */
.main{margin-left:var(--sbW);padding:0 0 80px;}
.site-hero{background:var(--headGrad);color:#fff;text-align:center;
  padding:72px 24px 60px;position:relative;overflow:hidden;}
.site-hero::before{content:"般若";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:340px;font-weight:900;
  color:rgba(212,168,75,.04);letter-spacing:30px;
  font-family:"Noto Serif TC",serif;pointer-events:none;white-space:nowrap;}
.hero-brand{font-size:17px;letter-spacing:14px;color:var(--goldL);
  margin-bottom:6px;font-family:"Noto Sans TC",sans-serif;
  position:relative;z-index:1;}
.hero-volume{font-size:14px;letter-spacing:10px;color:var(--gold);
  opacity:.85;margin-bottom:28px;font-family:"Noto Sans TC",sans-serif;
  position:relative;z-index:1;}
.hero-title{font-size:56px;font-weight:700;letter-spacing:14px;
  color:#fff;line-height:1.2;margin-bottom:14px;position:relative;z-index:1;
  text-shadow:0 2px 16px rgba(0,0,0,.4);}
.hero-subtitle{font-size:20px;letter-spacing:6px;color:var(--goldL);
  margin-bottom:30px;font-weight:300;position:relative;z-index:1;}
.hero-range{font-size:17px;letter-spacing:3px;color:rgba(255,255,255,.82);
  margin-bottom:14px;position:relative;z-index:1;line-height:1.9;}
.hero-author{font-size:18px;letter-spacing:6px;color:var(--gold);
  font-family:"Noto Sans TC",sans-serif;position:relative;z-index:1;}

/* preface */
.preface{max-width:880px;margin:48px auto 0;padding:0 28px;}
.preface-title{font-size:30px;letter-spacing:10px;color:var(--accent);
  text-align:center;margin-bottom:28px;
  padding-bottom:14px;border-bottom:1px solid var(--border);
  font-weight:600;}
.preface p{font-size:19px;line-height:2.1;color:var(--text);
  margin:0 0 18px;text-align:justify;text-indent:0;}

/* TOC */
.toc-section{max-width:1100px;margin:60px auto 50px;padding:0 28px;}
.toc-title{font-size:34px;letter-spacing:12px;color:var(--accent);
  text-align:center;margin-bottom:8px;font-weight:600;}
.toc-desc{font-size:17px;letter-spacing:4px;color:var(--text-muted);
  text-align:center;margin-bottom:36px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;}
.toc-card{display:flex;align-items:center;gap:16px;padding:18px 22px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  text-decoration:none;color:var(--text);
  box-shadow:0 2px 10px rgba(91,58,41,.05);
  transition:all .25s;}
.toc-card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(91,58,41,.16);
  border-color:var(--gold);}
.toc-card .toc-num{flex-shrink:0;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;font-family:"Noto Sans TC",sans-serif;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;letter-spacing:0;}
.toc-card .toc-name{font-size:19.5px;font-weight:600;line-height:1.7;
  color:var(--accent);margin-bottom:2px;}
.toc-card .toc-sub{font-size:13.5px;color:var(--text-muted);
  line-height:1.6;letter-spacing:1px;}

/* chapter */
section.chapter{max-width:1180px;margin:60px auto 0;padding:0 16px;}
.ch-head{background:var(--headGrad);color:#fff;text-align:center;
  padding:38px 24px 30px;border-radius:14px 14px 0 0;
  position:relative;overflow:hidden;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:14px;
  transform:translateX(-50%);width:60px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ch-head .ch-num{font-size:18px;letter-spacing:8px;color:var(--goldL);
  margin-bottom:10px;font-family:"Noto Sans TC",sans-serif;}
.ch-head .ch-name{font-size:34px;letter-spacing:6px;color:#fff;
  font-weight:700;margin-bottom:8px;line-height:1.35;}
.ch-head .ch-sub{font-size:17px;letter-spacing:2px;color:rgba(255,255,255,.85);
  font-family:"Noto Sans TC",sans-serif;}
.ch-body{background:var(--card);max-width:none;margin:0 auto;
  padding:30px 6px 12px;border:1px solid var(--border);border-top:0;
  border-radius:0 0 14px 14px;}

/* bridge */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 18px 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;
  font-family:"Noto Sans TC",sans-serif;font-size:12.5px;letter-spacing:2.2px;
  background:var(--gold);color:#fff;
  padding:3px 12px;border-radius:12px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;}

.next-link{display:block;text-align:center;margin:20px 18px 12px;
  padding:14px;background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;text-decoration:none;border-radius:8px;
  font-family:"Noto Sans TC",sans-serif;font-size:17px;letter-spacing:3px;
  transition:transform .25s,box-shadow .25s;}
.next-link:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(184,134,11,.4);}

/* iframe */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

/* progress capsule */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* back to top */
#backTop{position:fixed;right:18px;bottom:22px;width:44px;height:44px;
  border-radius:50%;background:var(--accent);color:#fff;border:0;
  font-size:18px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:110;
  box-shadow:0 4px 14px rgba(0,0,0,.25);}
#backTop.show{opacity:.92;pointer-events:auto;}

/* footer */
.site-footer{max-width:880px;margin:60px auto 0;padding:30px 24px;
  text-align:center;color:var(--text-muted);font-size:15px;
  border-top:1px solid var(--border);}
.site-footer p{margin:0 0 8px;}

/* responsive */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;}
  .hero-title{font-size:38px;letter-spacing:6px;}
  .ch-head .ch-name{font-size:24px;letter-spacing:3px;}
  .toc-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  html,body{font-size:15.5px;}
  .hero-title{font-size:30px;}
  .ch-head{padding:24px 14px 22px;}
  .ch-head .ch-name{font-size:20px;}
  .preface{padding:0 16px;}
  .toc-section{padding:0 16px;}
}

<script>
// =============== Sidebar 漢堡 ===============
var sb = document.getElementById('sb');
var sbToggle = document.getElementById('sbToggle');
if(sbToggle){
  sbToggle.addEventListener('click', function(){
    sb.classList.toggle('open');
  });
}

// =============== sb-brand 平滑回頂 ===============
var sbBrand = document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click', function(e){
    e.preventDefault();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

// =============== 閱讀進度 ===============
var rpFill = document.getElementById('rpFill');
var rpPct  = document.getElementById('rpPct');
function updateProgress(){
  var sh = document.documentElement.scrollHeight - window.innerHeight;
  var pct = sh > 0 ? Math.min(100, Math.max(0, window.scrollY / sh * 100)) : 0;
  if(rpFill) rpFill.style.width = pct + '%';
  if(rpPct)  rpPct.textContent  = Math.round(pct) + '%';
}
window.addEventListener('scroll', updateProgress, {passive:true});
updateProgress();

// =============== 接近頁尾淡出 ===============
(function(){
  var cap = document.getElementById('readProgress');
  if(!cap) return;
  function setHide(on){ cap.classList.toggle('hide-near-end', !!on); }
  var targets = [];
  var f1 = document.querySelector('[data-wy-notice="v2"]');
  if(f1) targets.push(f1);
  var f2 = document.querySelector('.site-footer');
  if(f2) targets.push(f2);
  if(!targets.length) return;
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      var any = entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    }, {root:null, rootMargin:'0px 0px -20px 0px', threshold:0.01});
    targets.forEach(function(t){ io.observe(t); });
  } else {
    var check=function(){
      var dh=document.documentElement.scrollHeight;
      var sb=window.scrollY+window.innerHeight;
      setHide(dh - sb < 240);
    };
    window.addEventListener('scroll', check, {passive:true});
    check();
  }
})();

// =============== 回頂按鈕 ===============
var backTop = document.getElementById('backTop');
if(backTop){
  window.addEventListener('scroll', function(){
    backTop.classList.toggle('show', window.scrollY > 600);
  }, {passive:true});
  backTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

// =============== 側欄高亮（active） ===============
function highlightSidebar(){
  var chapters = document.querySelectorAll('section.chapter');
  var trigger = window.innerHeight * 0.35;
  var activeId = null;
  chapters.forEach(function(c){
    if(c.getBoundingClientRect().top < trigger) activeId = c.id;
  });
  document.querySelectorAll('.sb-item').forEach(function(it){
    var href = it.getAttribute('href') || '';
    it.classList.toggle('active', href === '#' + activeId);
  });
}
window.addEventListener('scroll', highlightSidebar, {passive:true});
highlightSidebar();

// =============== iframe 自動高度 ===============
function resizeFrame(f){
  try{
    var d = f.contentDocument || f.contentWindow.document;
    if(!d || !d.body) return;
    d.body.style.minHeight = '0';
    d.body.style.height    = 'auto';
    if(d.documentElement){
      d.documentElement.style.minHeight = '0';
      d.documentElement.style.height    = 'auto';
    }
    var h = d.body.scrollHeight;
    if(h > 100){
      f.style.height    = h + 'px';
      f.style.minHeight = '0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries = 0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries < 30) setTimeout(tick, 200);
  }
  if(f.contentDocument && f.contentDocument.readyState === 'complete'){
    tick();
  } else {
    f.addEventListener('load', tick);
  }
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize', function(){
  clearTimeout(rzT);
  rzT = setTimeout(resizeAllFrames, 200);
});
// 錨點防錯跳
document.addEventListener('click', function(e){
  var a = e.target;
  while(a && a.tagName !== 'A') a = a.parentElement;
  if(!a) return;
  var h = a.getAttribute('href');
  if(!h || h.charAt(0) !== '#' || h.length < 2) return;
  var id = h.substring(1);
  var el = document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect = el.getBoundingClientRect();
    var y = window.scrollY + rect.top - 20;
    window.scrollTo({top:y, behavior:'smooth'});
  }, 60);
}, true);
// 前 15 秒持續輪詢
var _rt=0, _riv=setInterval(function(){
  _rt++; resizeAllFrames();
  if(_rt > 50) clearInterval(_riv);
}, 300);

// =============== 防複製（外層）===============
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev, blk, true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy43dzdl-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
